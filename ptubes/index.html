<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preposition Tubes · 9º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12152e;--card:#1f2456;--ink:#eef1ff;--mute:#cfd5ff;--yel:#ffd166;--good:#7CFC9A;--bad:#ff8a80;--disp:"Bricolage Grotesque",system-ui,sans-serif;--body:"Source Sans 3",system-ui,sans-serif;--label:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 var(--body);min-height:100vh;background-image:radial-gradient(circle at 20% 0,#2a2f6b 0,transparent 55%),radial-gradient(circle at 90% 100%,#2a1f56 0,transparent 50%)}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:var(--disp);margin:0}
h1{color:var(--yel);font-size:clamp(30px,6vw,46px);text-shadow:0 0 14px rgba(255,209,102,.4)}
.label{font:700 12px/1.2 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--card);border:2px solid #4cc9f0;border-bottom-width:6px;border-radius:20px;padding:20px}
.btn{font:800 17px var(--label);border-radius:999px;padding:12px 22px;min-height:48px;border:2px solid #12152e;border-bottom-width:5px;background:var(--yel);color:#12152e;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border-color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}
.how{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.how li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px}
.how .e{font-size:28px;text-align:center}
.lv{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.lv button{font:800 16px var(--label);padding:10px 16px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}
.lv button.on{background:var(--yel);color:#12152e;border-color:var(--yel)}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.hud div{background:#0b0d1f;border-radius:14px;padding:8px 14px;box-shadow:inset 0 0 0 2px #3b3f8f}
.hud b{display:block;font:800 22px var(--disp);color:var(--yel)}
.rack{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 14px;padding:26px 10px 18px;border-radius:20px;background:linear-gradient(#1a1e4a,#14173a);box-shadow:inset 0 -14px 0 #3b2a1a,inset 0 0 0 2px #3b3f8f}
.tube{position:relative;width:118px;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:3px;padding:6px 6px 10px;border:3px solid rgba(255,255,255,.75);border-top:none;border-radius:0 0 46px 46px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.16) 30%,rgba(255,255,255,.04) 60%);cursor:pointer;transition:transform .18s,box-shadow .18s}
.tube::before{content:"";position:absolute;top:-6px;left:-9px;right:-9px;height:8px;border-radius:6px;background:rgba(255,255,255,.75)}
.tube.sel{transform:translateY(-14px);box-shadow:0 0 24px rgba(255,209,102,.6)}
.tube.bad{animation:shake .45s;border-color:var(--bad)}
.tube.done{cursor:default;border-color:#fff}
@keyframes shake{20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.layer{height:42px;display:flex;align-items:center;justify-content:center;font:800 15px var(--label);color:#12152e;background:#e6e2ff;border-radius:8px;padding:0 4px;text-align:center;line-height:1.05;position:relative;overflow:hidden}
.layer:first-child{border-radius:8px 8px 36px 36px;height:48px}
.layer::after{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:rgba(255,255,255,.45)}
.layer.top.lift{transform:translateY(-10px);box-shadow:0 0 0 3px var(--yel)}
.layer{flex-direction:column}.layer .tag{font:900 9px var(--label);background:#12152e;color:#fff;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tname{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 12px var(--label);color:#fff;background:#0b0d1f;border-radius:999px;padding:3px 10px}
.say{min-height:28px;font-weight:700;margin:16px 0 8px;text-align:center}
.say.good{color:var(--good)}.say.bad{color:var(--bad)}
.list{display:grid;gap:8px;margin:12px 0}
.list div{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px}
.list b{display:block}
.mean{color:var(--mute)}
.stars{font-size:40px;letter-spacing:6px}
@media (max-width:560px){.tube{width:84px}.tube::before{left:-5px;right:-5px}.layer{font-size:12.5px;height:38px}.layer:first-child{height:42px}.rack{gap:44px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* each set: groups with a name, a colour, a short rule, and words */
var SETS={
 preps:{t:"Prepositional phrases",d:"Group the words by their preposition: at, by, in or on. “time” goes with two!",icon:"🧩",groups:[
  {n:"at",c:"#ff8a5c",r:"at all · at first · at last · at least · at once · at the moment · at times",w:["all","first","last","least","once","the moment","times"]},
  {n:"by",c:"#3ccf9f",r:"by accident · by chance · by hand · by mistake · by the time",w:["accident","chance","hand","mistake","the time"]},
  {n:"in",c:"#9d93ff",r:"in a hurry · in addition to · in danger · in the end · in time · in trouble",w:["a hurry","addition to","danger","the end","time","trouble"]},
  {n:"on",c:"#f2b84b",r:"on average · on foot · on purpose · on sale · on time",w:["average","foot","purpose","sale","time"]}]}
};
var LEVELS=[["🌱 1 · Easy",3,3,false],["🌿 2 · Medium",4,4,false],["🔤 3 · Base forms",4,4,true],["🌳 3 · Hard",5,4,false],["🏆 5 · Master",5,4,true]];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function h(t,at){var e=document.createElement(t);if(at)for(var k in at){if(k==="on")for(var ev in at.on)e.addEventListener(ev,at.on[ev]);else if(at[k]!=null)e.setAttribute(k,at[k])}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==="string"?document.createTextNode(x):x)});else e.appendChild(typeof c==="string"?document.createTextNode(c):c)}return e}
var app=document.getElementById("app"),mode="preps",level=0,G=null;
function speak(w){try{if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function start(){
  G=null;app.innerHTML="";
  var ms=h("div",{class:"lv"}),lv=h("div",{class:"lv"});
  function draw(){ms.innerHTML="";Object.keys(SETS).forEach(function(k){ms.appendChild(h("button",{class:k===mode?"on":null,on:{click:function(){mode=k;draw()}}},SETS[k].icon+" "+SETS[k].t))});
    if(LEVELS[level][3]&&!SETS[mode].base)level=1;lv.innerHTML="";LEVELS.forEach(function(l,i){if(l[3]&&!SETS[mode].base)return;lv.appendChild(h("button",{class:i===level?"on":null,on:{click:function(){level=i;draw()}}},l[0]))})}
  draw();
  app.appendChild(h("div",{class:"card"},h("span",{class:"label"},"English Arcade"),h("h1",null,"🧪 Preposition Tubes"),
    h("ol",{class:"how"},
      h("li",null,h("span",{class:"e"},"👆"),h("span",null,"Tap a tube to pick up the word on top. Tap another tube to pour it there.")),
      h("li",null,h("span",{class:"e"},"🧪"),h("span",null,"Put the words of the same group together. A full tube with one group lights up with its colour!")),
      h("li",null,h("span",{class:"e"},"⚠️"),h("span",null,"A full tube with mixed groups shakes: something there doesn't belong.")),
      h("li",null,h("span",{class:"e"},"💡"),h("span",null,"Need help? A hint shows the group of the word on top. You have 3."))),
    h("span",{class:"label"},"Level"),lv,
    h("div",{class:"row"},h("button",{class:"btn",on:{click:play}},"▶ Play"))));
}
function play(){
  var S=SETS[mode],L=LEVELS[level],ng=Math.min(L[1],S.groups.length),cap=L[2]+(S.groups.length<L[1]&&level>=3?1:0),base=L[3]&&S.base;
  var groups=shuffle(S.groups).slice(0,ng),words=[];
  groups.forEach(function(g,gi){shuffle(g.w).slice(0,cap).forEach(function(w){var p=w.split(":");words.push({w:base?p[1]:p[0],f:p[0],b:p[1]||p[0],g:gi})})});
  words.forEach(function(x){x.acc=[];groups.forEach(function(g,gi){if(g.w.some(function(w){return w.split(":")[base?1:0]===x.w||w.split(":")[0]===x.f}))x.acc.push(gi)})});
  var tubes;do{var sh=shuffle(words);tubes=[];for(var i=0;i<ng;i++)tubes.push(sh.slice(i*cap,(i+1)*cap));}while(tubes.some(function(t){return common(t)>=0}));
  tubes.push([]);tubes.push([]);
  G={S:S,base:base,lvl:L[0],groups:groups,cap:cap,tubes:tubes,done:tubes.map(function(){return -1}),sel:-1,moves:0,mistakes:0,hints:3,shown:{}};
  render("Tap a tube to pick up its top word.");
}
function render(msg,cls,badTube){
  app.innerHTML="";
  app.appendChild(h("div",{class:"row spread"},h("h2",null,"🧪 Word Tubes · "+G.S.t),h("button",{class:"btn ghost",on:{click:start}},"← Quit")));
  var fin=G.done.filter(function(d){return d>=0}).length;
  app.appendChild(h("div",{class:"hud"},h("div",null,h("span",{class:"label"},"Groups done"),h("b",null,fin+" / "+G.groups.length)),
    h("div",null,h("span",{class:"label"},"Moves"),h("b",null,String(G.moves))),h("div",null,h("span",{class:"label"},"Mixed tubes"),h("b",null,String(G.mistakes)))));
  app.appendChild(h("p",{class:"mean",style:"margin:0 0 8px"},(G.base?"🔤 "+G.S.dBase:G.S.d)+" · "+G.lvl));
  var rack=h("div",{class:"rack"});
  G.tubes.forEach(function(t,ti){
    var d=G.done[ti],el=h("div",{class:"tube"+(G.sel===ti?" sel":"")+(d>=0?" done":"")+(badTube===ti?" bad":""),role:"button",tabindex:"0","aria-label":"Tube "+(ti+1)+": "+(t.map(function(x){return x.w}).join(", ")||"empty"),
      style:"height:"+(G.cap*45+30)+"px",on:{click:function(){tap(ti)},keydown:function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tap(ti)}}}});
    t.forEach(function(x,k){var top=k===t.length-1,col=d>=0?G.groups[d].c:null;
      var lay=h("div",{class:"layer"+(top?" top":"")+(top&&G.sel===ti?" lift":""),style:col?"background:"+col:null},x.w);
      if(G.shown[x.w]!=null&&d<0)lay.appendChild(h("span",{class:"tag"},G.groups[G.shown[x.w]].n));
      el.appendChild(lay)});
    if(d>=0)el.appendChild(h("span",{class:"tname"},G.groups[d].n));
    rack.appendChild(el);
  });
  app.appendChild(rack);
  app.appendChild(h("p",{class:"say "+(cls||""),role:"status"},msg||""));
  app.appendChild(h("div",{class:"row",style:"justify-content:center"},h("button",{class:"btn ghost",disabled:G.hints&&G.sel>=0?null:"disabled",on:{click:hint}},"💡 Hint ("+G.hints+")"),
    h("button",{class:"btn ghost",on:{click:showRules}},"📖 Rules")));
}
function tap(ti){
  if(G.done[ti]>=0)return;
  var t=G.tubes[ti];
  if(G.sel<0){if(!t.length)return;G.sel=ti;if(G.S.audio)speak(t[t.length-1].w);render("Now tap the tube where “"+t[t.length-1].w+"” goes.");return}
  if(G.sel===ti){G.sel=-1;render("");return}
  if(t.length>=G.cap){render("That tube is full. Choose another one.","bad");return}
  var src=G.tubes[G.sel],x=src.pop();t.push(x);G.sel=-1;G.moves++;
  if(t.length===G.cap){
    var cg=common(t);if(cg>=0&&!feasible(ti,cg)){render("🤔 Careful! “time” goes with two prepositions, but the other group needs one of them. Move one “time” to the other tube.","bad",ti);return}
    if(cg>=0){G.done[ti]=cg;var g=G.groups[cg];
      if(G.done.filter(function(d){return d>=0}).length===G.groups.length){render("🎉 All groups sorted!","good");setTimeout(end,900);return}
      render("✨ "+g.n+"! "+g.r,"good");return}
    G.mistakes++;render("🤔 This tube is full, but the words are mixed. Something doesn't belong.","bad",ti);return}
  render("");
}
function common(t){if(!t.length)return -1;var c=t[0].acc.filter(function(gi){return t.every(function(y){return y.acc.indexOf(gi)>=0})});return c.length?c[0]:-1}
function feasible(ti,cg){var need={};G.groups.forEach(function(g,gi){if(gi!==cg&&G.done.indexOf(gi)<0)need[gi]=G.cap});var amb=[];
  G.tubes.forEach(function(t,k){if(k===ti||G.done[k]>=0)return;t.forEach(function(x){var a=x.acc.filter(function(gi){return need[gi]!=null});if(a.length===1)need[a[0]]--;else amb.push(a)})});
  amb.forEach(function(a){a.sort(function(p,q){return need[q]-need[p]});if(a.length)need[a[0]]--});
  return Object.keys(need).every(function(k){return need[k]===0})}
function hint(){
  if(G.sel<0||!G.hints)return;var t=G.tubes[G.sel],x=t[t.length-1];G.hints--;G.shown[x.w]=x.g;
  render("💡 “"+x.w+"”"+(x.f!==x.w?" ("+x.f+")":"")+" → "+x.acc.map(function(gi){return G.groups[gi].n}).join(" or ")+(x.acc.length>1?"":" ("+G.groups[x.g].r+")"));
}
function showRules(){
  var c=h("div",{class:"list"},G.groups.map(function(g){return h("div",{style:"box-shadow:inset 6px 0 0 "+g.c},h("b",null,g.n),h("span",{class:"mean"},g.r))}));
  var m=h("div",{style:"position:fixed;inset:0;background:rgba(10,12,30,.9);display:grid;place-items:center;padding:16px;z-index:9"},
    h("div",{class:"card",style:"max-width:520px;width:100%"},h("h3",null,"📖 The groups"),c,h("button",{class:"btn",on:{click:function(){m.remove()}}},"OK")));
  document.body.appendChild(m);
}
function end(){
  var stars=G.mistakes===0&&G.hints===3?3:G.mistakes<=2?2:1;
  app.innerHTML="";
  var c=h("div",{class:"card"},h("span",{class:"label"},"You did it!"),h("h1",null,"🧪 All tubes sorted!"),
    h("div",{class:"stars"},"⭐".repeat(stars)+"☆".repeat(3-stars)),
    h("p",null,"Moves: ",h("b",null,String(G.moves))," · Mixed tubes: ",h("b",null,String(G.mistakes))," · Hints used: ",h("b",null,String(3-G.hints))),
    h("h3",null,"The groups"),
    h("div",{class:"list"},G.groups.map(function(g,gi){var ws=[];G.tubes.forEach(function(t,ti){if(G.done[ti]===gi)t.forEach(function(x){ws.push(x.b!==x.f?x.b+" → "+x.f:x.w)})});
      return h("div",{style:"box-shadow:inset 6px 0 0 "+g.c},h("b",null,g.n+" · "+g.r),h("span",null,ws.join(", ")))})),
    h("div",{class:"row",style:"margin-top:16px"},h("button",{class:"btn",on:{click:play}},"🔄 Play again"),h("button",{class:"btn ghost",on:{click:start}},"⚙️ Change game or level")));
  app.appendChild(c);window.scrollTo(0,0);
}
start();
</script>
