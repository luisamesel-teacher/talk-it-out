<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk It Out General English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one winding trail of 13 stops down the page; each stop opens a module of six notched activity cards. */
:root{
  --bg:#f2f4fa; --surface:#ffffff; --ink:#17213b; --muted:#5a6583; --line:#d7dcea;
  --brand:#1f3a8a; --on-brand:#ffffff; --track:#f0a92b; --track-soft:#fdf1d8;
  --good:#17805f; --good-soft:#dff3ec; --bad:#c23f37; --bad-soft:#fbe4e2;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Source Sans 3","Segoe UI",sans-serif;
  --label:"Inter","Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#172038; --ink:#eef1f8; --muted:#a4adc7; --line:#2c3657;
    --brand:#93abff; --on-brand:#0e1424; --track:#f5b947; --track-soft:#3a3020;
    --good:#4fcaa2; --good-soft:#143a31; --bad:#ff877d; --bad-soft:#44201f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#172038; --ink:#eef1f8; --muted:#a4adc7; --line:#2c3657;
  --brand:#93abff; --on-brand:#0e1424; --track:#f5b947; --track-soft:#3a3020;
  --good:#4fcaa2; --good-soft:#143a31; --bad:#ff877d; --bad-soft:#44201f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--track);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 80px}
.label{font-family:var(--label);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:32px}
.brand{text-align:left;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;margin-right:auto}
.mark{position:relative;width:38px;height:32px;flex:none}
.mark i{position:absolute;display:block}
.mark i:first-child{left:0;top:0;width:26px;height:20px;background:var(--brand);border-radius:8px 8px 8px 2px}
.mark i:last-child{right:0;bottom:0;width:22px;height:17px;background:var(--track);border-radius:7px 7px 2px 7px}
.brand b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--label);font-size:11px;color:var(--muted);font-weight:500}
.stat{font-family:var(--label);font-size:13px;font-weight:600;color:var(--muted)}
.stat b{font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.pillbtn{font-family:var(--label);font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--track-soft);border:2px solid var(--track);font-size:22px;display:grid;place-items:center;padding:0}

/* buttons */
.btn{font-family:var(--label);font-weight:600;font-size:15px;background:var(--brand);color:var(--on-brand);border:0;border-radius:10px;padding:12px 20px}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);font-family:var(--label);font-size:14px;font-weight:600}

/* notched card, the brand's cut corner */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative}
.notch{clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);border-radius:14px}

/* home */
.hero{display:grid;gap:14px;margin-bottom:36px}
.hero h1{font-size:clamp(38px,7vw,64px);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--track) 62%)}
.hero p{margin:0;max-width:56ch;color:var(--muted)}
.hero .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.trail{position:relative;display:grid;gap:14px;padding-left:46px}
.trail::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:4px;border-radius:2px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 18px)}
.lvl{font-family:var(--display);font-weight:800;font-size:26px;margin-top:18px;position:relative}
.lvl::before{content:"";position:absolute;left:-46px;top:2px;width:34px;height:28px;background:var(--brand);border-radius:9px 9px 9px 2px}
.lvl span{font-family:var(--label);font-size:13px;font-weight:500;color:var(--muted);margin-left:8px}
.stop{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;position:relative}
.stop:hover{border-color:var(--brand)}
.stop::before{content:"";position:absolute;left:-39px;top:50%;width:16px;height:16px;margin-top:-10px;border-radius:50%;background:var(--bg);border:4px solid var(--line)}
.stop.started::before{border-color:var(--track)}
.stop.done::before{border-color:var(--good);background:var(--good)}
.stop h3{font-size:21px;font-weight:700}
.stop .meta{grid-column:1;color:var(--muted);font-size:15px}
.stop .side{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--label);font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.stars{color:var(--track);letter-spacing:2px;font-size:17px}
.stars s{text-decoration:none;color:var(--line)}

/* module */
.mhead{display:grid;gap:10px;margin-bottom:22px}
.mhead h1{font-size:clamp(32px,6vw,48px);font-weight:800;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--label);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.sit{background:var(--track-soft);border-color:var(--track);margin-bottom:22px}
.sit h2{font-size:22px;margin:4px 0 6px}
.sit p{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.act{display:grid;gap:6px;text-align:left;align-content:start;min-height:150px}
.act:hover{border-color:var(--brand)}
.act h3{font-size:20px}
.act p{margin:0;color:var(--muted);font-size:15.5px}
.act .foot{margin-top:auto;padding-top:8px}
.act.cp{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.act.cp p,.act.cp .label{color:var(--on-brand);opacity:.85}

/* activity shell */
.shell{display:grid;gap:18px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h2{font-size:24px;margin-right:auto}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--track);border-radius:4px;transition:width .25s}
.hint{color:var(--muted);margin:0;font-size:16px}
.q{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.4vw,30px);line-height:1.25;margin:0}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:18px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:12px 16px;font-size:16.5px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb b{font-family:var(--label);font-size:14px}
.rowend{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}/* UX-11..15: result next step, sticky answer bar, write-it diff */.res .rowend{justify-content:center}.res .btn.next{background:var(--track);color:#12152e;font-size:17px;padding:14px 22px}.goal{margin:0;font-family:var(--label);font-weight:600;font-size:15px;color:var(--ink)}.fbar:empty{display:none}@media (max-width:600px){.fbar{position:sticky;bottom:0;z-index:5;margin:0 -20px;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -8px 18px rgba(0,0,0,.25)}.fbar .rowend .btn{flex:1;padding:15px}}.wdiff{display:grid;gap:4px;margin-top:8px;font-size:17px;color:var(--ink)}.wdiff s{color:var(--bad);text-decoration:line-through;font-weight:700}.wdiff .label{margin-right:6px}.top>.link.sure{border-color:var(--bad);color:var(--bad)}

/* chat */
.chat{display:grid;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px 14px 14px 3px;background:var(--bg);justify-self:start}
.msg.me{justify-self:end;background:var(--brand);color:var(--on-brand);border-radius:14px 14px 3px 14px}
.who{font-family:var(--label);font-size:11px;font-weight:600;opacity:.7;display:block}

/* builder */
.line{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:2px dashed var(--line);border-radius:12px;background:var(--surface)}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.word{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-size:18px;font-weight:600}
.line .word{border-color:var(--brand)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/0.82;border-radius:12px;border:1.5px solid var(--line);background:var(--brand);color:transparent;font-size:16px;font-weight:600;padding:4px;display:grid;place-items:center;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.mc.up{background:var(--surface);color:var(--ink)}
.mc.up.em{font-size:34px}
.mc.hit{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
@media (max-width:480px){.mem{grid-template-columns:repeat(3,1fr)}}

/* speed */
.clock{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.flash{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,34px);text-align:center;padding:44px 20px;min-height:170px;display:grid;place-items:center;border-width:3px}
.flash.ok{border-color:var(--good)} .flash.no{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .btn{padding:18px;font-size:17px}
.btn.yes{background:var(--good);color:var(--surface)} .btn.nope{background:var(--bad);color:var(--surface)}

/* result */
.res{text-align:center;display:grid;gap:12px;justify-items:center;padding:34px 22px}
.res .big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.res .stars{font-size:34px}
.rev{display:grid;gap:8px;text-align:left}
.rev div{padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:16px}
.rev s{color:var(--bad)} .rev b{color:var(--good)}

/* avatars */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.shop .card{text-align:center;display:grid;gap:8px;justify-items:center}
.shop .face{font-size:44px}
/* grammar guide */
.guide{display:grid;gap:6px;width:100%;text-align:left;margin-bottom:22px;border-left:6px solid var(--brand)}
.guide:hover{border-color:var(--brand)}
.guide h3{font-size:20px}
.guide p{margin:0;color:var(--muted);font-size:15.5px}
.guide .badge{justify-self:start}
.gpt{display:grid;gap:12px;margin-bottom:18px}
.gpt h2{font-size:26px}
.gpt p{margin:0;max-width:62ch}
.gtab{display:grid;grid-template-columns:minmax(90px,auto) 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gtab>*{padding:10px 14px;border-top:1px solid var(--line)}
.gtab>*:nth-child(-n+2){border-top:0}
.gtab b{font-family:var(--label);font-size:13px;font-weight:600;background:var(--bg);color:var(--brand)}
.gpt .chat{padding:12px}
@media (max-width:480px){.gtab{grid-template-columns:1fr}.gtab b{border-top:1px solid var(--line)}}
.tips{margin:0;padding-left:22px;display:grid;gap:6px}
.tl{background:var(--track-soft);border:1px solid var(--track);border-radius:12px;padding:16px;display:grid;gap:12px}
.tl h3{font-size:20px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pairs>*{background:var(--surface);padding:9px 12px}
.pairs b{font-family:var(--label);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pairs span:nth-child(even){font-weight:600}
.tl p{font-size:16.5px}
/* arcade */
.arc{border-top:6px solid var(--track)}
.lvup{background:var(--track-soft);color:var(--ink);border:1px solid var(--track)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 20px;margin:14px 0 10px}
.score .label{color:inherit;opacity:.8;display:block}
.score .side b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.score .side:last-child{text-align:right}
.score .mid{text-align:center;display:grid;gap:2px}
.say{min-height:30px;font-weight:600;margin-bottom:10px}

/* sentence race */
.road{cursor:pointer;max-width:100%;width:auto;max-height:calc(100vh - 175px);margin:0 auto;display:block}
@media (max-width:600px){.road{max-height:calc(100vh - 160px)}}
.gtop.compact>.hint{display:none}
.gtop.compact{padding:10px 14px}
.rtrack{position:relative;display:grid;gap:6px;padding:10px 46px 10px 10px;border-radius:12px;background:#0b0d1f;box-shadow:inset 0 0 0 2px #3b3f8f;margin-bottom:10px}
.rlane{position:relative;height:30px;border-radius:999px;background:repeating-linear-gradient(90deg,#2b3245 0 18px,#343c52 18px 36px)}
.rcar{position:absolute;top:0;font-size:24px;line-height:30px;transition:left .3s linear}
.rcar.me{transform:scaleX(-1)}
.rflag{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:26px}
.rcue{display:grid;gap:4px}
.remoji{font-size:34px;line-height:1.2;letter-spacing:2px}
.rcue small.rtask{color:var(--muted);font-weight:500;font-size:14px}
.rcue{font-weight:700;font-size:17px;margin:4px 0 6px}
.rbuilt{min-height:38px;margin-bottom:10px}
/* premium avatars */
.faceimg{width:34px;height:34px;object-fit:contain;display:block;margin:auto}
.who .faceimg,.score .faceimg,.label .faceimg{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin:0}
.avatar:has(.faceimg){padding:0;overflow:visible}
.pshop{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pcard{display:grid;gap:8px;justify-items:center;text-align:center;background:linear-gradient(180deg,var(--track-soft),var(--surface) 60%)}
.pcard.own{background:linear-gradient(180deg,var(--good-soft),var(--surface) 60%)}
:root[data-theme="dark"] .pcard{background:linear-gradient(180deg,color-mix(in srgb,var(--glow) 18%,var(--s2)),var(--s2) 65%)}
.pimg{width:120px;height:120px;object-fit:contain;transition:transform .15s}
.pcard:hover .pimg{transform:scale(1.06) rotate(-2deg)}
/* word lab */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pic{display:grid;gap:4px;justify-items:center;text-align:center;padding:14px 8px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.pic:hover{border-color:var(--brand)}
.em{font-size:40px;line-height:1.1}
.pic b{font-size:19px}.pic i,.opp i{font-size:12.5px;color:var(--muted)}
.pic{align-content:start}
.pic .def{font-size:14.5px;font-weight:600;line-height:1.3;color:var(--ink);background:var(--bg);border-radius:8px;padding:6px 8px;width:100%}
.pics{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.qsub{text-align:center;font-size:19px;font-weight:600;margin:0}
.opp{display:grid;gap:8px}
.oprow{display:grid;grid-template-columns:52px 1fr 26px 1fr;gap:8px;align-items:center}
.oprow button{display:grid;gap:2px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid;font:inherit;color:#17213b;cursor:pointer}
.oa{background:#dcf3e9;border-color:#17805f}.ob{background:#ffe0dc;border-color:#c23f37}
.oprow button i{color:#44506b}
.vs{text-align:center;font-weight:800;color:var(--muted)}
.meter{display:grid;grid-template-columns:auto minmax(90px,1fr) 1.4fr;gap:8px 14px;align-items:center}
.meter>b{font-family:var(--display);font-size:18px;color:#5b3fb0}
.mbar{position:relative;height:26px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.mbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#b9a6ee,#5b3fb0);border-radius:999px}
.mbar span{position:absolute;right:8px;top:3px;font-size:12.5px;font-weight:700;color:var(--ink)}
.meter.deg .mbar i{background:linear-gradient(90deg,#ffd9a0,#c23f37)}
.advm{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.am{display:grid;grid-template-columns:44px auto 18px 1fr;gap:4px 8px;align-items:center;padding:12px 14px;border-radius:12px;background:#ebe4fb;border:2px solid #5b3fb0;color:#17213b}
.am .em{font-size:30px;grid-row:span 2}
.am>span:last-of-type{grid-column:2/5;font-size:15.5px}
.am.irr{background:#fdf0d2;border-color:#b05a00}
.am small{grid-column:2/5;font-family:var(--label);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b05a00}
.am .kw{color:#3d2a8a}
.train .t-a{background:#dcf3e9;border-color:#17805f;color:#17213b}
@media (max-width:560px){.meter{grid-template-columns:auto 1fr}.meter>span{grid-column:1/3;margin-bottom:6px}.oprow{grid-template-columns:40px 1fr 18px 1fr}}
/* numbers lab and voice */
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;text-align:center;font-weight:600;font-size:15px}
.clocks svg{display:block;width:100%;max-width:130px;margin:0 auto 6px;height:auto}
.bigclock svg{display:block;width:170px;height:auto;margin:0 auto}
.figure{text-align:center;font-size:clamp(34px,8vw,56px);font-variant-numeric:tabular-nums}
.vrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 18px}
.vrow>div{display:grid;gap:2px}
@media (max-width:480px){.vrow{grid-template-columns:1fr 1fr}.vrow>div{grid-column:1/3}}
/* clear navigation, level tags, difficulty */
.nav{flex-basis:100%;display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0}
.navbtn{font-family:var(--label);font-weight:600;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;padding:10px 16px;min-height:44px}
.navbtn:hover{background:var(--track-soft)}
.navbtn.main{background:var(--ink);color:var(--bg);margin-left:auto}
#app>p:first-child>.link,.top>.link{display:inline-block;border:1.5px solid var(--brand);border-radius:999px;padding:9px 16px;background:var(--surface);font-size:15px;min-height:42px}
.lvtag{display:inline-block;font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.04em;line-height:1;padding:5px 8px;border-radius:6px;color:#fff;background:#3a4563;vertical-align:middle;margin-right:4px;text-transform:none}
.lvtag.big{font-size:16px;padding:7px 12px}
.lvtag[data-lv="A1"]{background:#17805f}
.lvtag[data-lv="A2"]{background:#b05a00}
.lvtag[data-lv="B1"]{background:#5b3fb0}.lvtag[data-lv="B2"]{background:#c2185b}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mitem{display:grid;gap:4px;text-align:left;padding:14px 16px;font-size:16px}
.mitem:hover{border-color:var(--brand)}
.mitem span:not(.lvtag){color:var(--muted);font-size:14.5px}
.mitem .lvtag{justify-self:start}
.diff{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
.diff .pillbtn{min-width:44px;min-height:40px;font-size:15px}
.diff .pillbtn:disabled{opacity:.5;cursor:not-allowed}
.diff .hint{font-size:14px}
/* sentence builder: colour by part of the sentence, with a small written label too */
.word{display:inline-grid;gap:1px;justify-items:start;line-height:1.2}
.word small{font-family:var(--label);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.word.t-s{background:#dbe6ff;border-color:#1f3a8a;color:#17213b}
.word.t-v{background:#ffe0dc;border-color:#c23f37;color:#17213b}
.word.t-a{background:#dcf3e9;border-color:#17805f;color:#17213b}
.word.t-d{background:#ebe4fb;border-color:#5b3fb0;color:#17213b}
.word.t-q,.word.t-l{background:#fdf0d2;border-color:#b05a00;color:#17213b}
.line .word{border-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .word{font-size:13px;padding:5px 10px;font-family:var(--label);cursor:default}
.bctx{display:grid;gap:6px;border-left:6px solid var(--track);padding:16px 18px}
.bctx p{margin:0}
@media (prefers-reduced-motion:reduce){.bosspic.enter{animation:none}}
@media (max-width:560px){.bossbox{grid-template-columns:1fr}.bosspic{max-width:240px;margin:0 auto;order:-1}}
@media (prefers-reduced-motion:reduce){.hit,.atk{animation:none}}
@media (max-width:480px){.bossbox{grid-template-columns:110px 1fr;gap:14px;padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== arcade look for the whole site (default). Menu → "Light look" switches back. ===== */
:root[data-theme="dark"]{
  --bg:#12152e; --surface:#1c2050; --ink:#eef1ff; --muted:#b9c0e8; --line:#3a3f8c;
  --brand:#8fb0ff; --on-brand:#0b0d1f; --track:#ffd166; --track-soft:#3a3320;
  --good:#5be3a8; --good-soft:#123b30; --bad:#ff7f8f; --bad-soft:#47202a; --glow:#4cc9f0;
}
:root[data-theme="dark"] body[data-tone="sand"]{--glow:#ffd166}
:root[data-theme="dark"] body[data-tone="mint"]{--glow:#7bf1a8}
:root[data-theme="dark"] body[data-tone="lilac"]{--glow:#b39dff}
:root[data-theme="dark"] body[data-tone="peach"]{--glow:#ff9f6b}
:root[data-theme="dark"] body[data-tone="rose"]{--glow:#ff6b9a}
:root[data-theme="dark"] body[data-tone="lemon"]{--glow:#f6f06b}
:root[data-theme="dark"] body[data-tone="sky"]{--glow:#4cc9f0}
:root[data-theme="dark"] body{--s1:color-mix(in srgb,var(--bg) 84%,#fff);--s2:color-mix(in srgb,var(--bg) 92%,#fff);--surface:var(--s2);--line:color-mix(in srgb,var(--bg) 62%,#fff);background:
  radial-gradient(900px 520px at 8% -8%,color-mix(in srgb,var(--glow) 26%,transparent),transparent 62%),
  radial-gradient(800px 480px at 105% 6%,rgba(255,107,154,.16),transparent 60%),
  radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.55),transparent),radial-gradient(1.5px 1.5px at 70% 18%,rgba(255,255,255,.45),transparent),
  radial-gradient(1.5px 1.5px at 45% 75%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 88% 62%,rgba(255,255,255,.45),transparent),
  var(--bg);background-attachment:fixed;background-size:auto,auto,320px 320px,320px 320px,320px 320px,320px 320px,auto}
:root[data-theme="dark"] .bar{border-bottom-color:color-mix(in srgb,var(--glow) 35%,var(--line))}
:root[data-theme="dark"] .hero h1,:root[data-theme="dark"] .mhead h1{color:var(--track);text-shadow:0 0 18px rgba(255,209,102,.35)}
:root[data-theme="dark"] .hero h1 em{background:none;color:var(--glow);text-shadow:0 0 16px color-mix(in srgb,var(--glow) 60%,transparent)}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .stop{background:linear-gradient(160deg,var(--s1),var(--s2));border:2px solid color-mix(in srgb,var(--glow) 40%,var(--line));box-shadow:0 0 18px color-mix(in srgb,var(--glow) 14%,transparent)}
:root[data-theme="dark"] .act,:root[data-theme="dark"] .stop,:root[data-theme="dark"] .mitem,:root[data-theme="dark"] .guide{transition:transform .15s,box-shadow .15s,border-color .15s}
:root[data-theme="dark"] .act:hover,:root[data-theme="dark"] .stop:hover,:root[data-theme="dark"] .mitem:hover,:root[data-theme="dark"] .guide:hover{transform:translateY(-3px);border-color:var(--glow);box-shadow:0 0 24px color-mix(in srgb,var(--glow) 45%,transparent)}
:root[data-theme="dark"] .act h3,:root[data-theme="dark"] .stop h3,:root[data-theme="dark"] .guide h3{color:var(--glow)}
:root[data-theme="dark"] .grid>.act:nth-child(4n+1){--glow:#7bf1a8}:root[data-theme="dark"] .grid>.act:nth-child(4n+2){--glow:#ff6b9a}
:root[data-theme="dark"] .grid>.act:nth-child(4n+3){--glow:#ffd166}:root[data-theme="dark"] .grid>.act:nth-child(4n+4){--glow:#4cc9f0}
:root[data-theme="dark"] .btn{background:var(--track);color:#12152e;border-radius:999px;font-weight:800;box-shadow:0 0 14px rgba(255,209,102,.35)}
:root[data-theme="dark"] .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 20px rgba(255,209,102,.6)}
:root[data-theme="dark"] .btn.ghost{background:transparent;color:var(--ink);border:2px solid color-mix(in srgb,var(--glow) 60%,var(--line));box-shadow:none}
:root[data-theme="dark"] .btn.yes{background:var(--good);color:#0b0d1f}:root[data-theme="dark"] .btn.nope{background:var(--bad);color:#0b0d1f}
:root[data-theme="dark"] .pillbtn,:root[data-theme="dark"] .chip,:root[data-theme="dark"] .navbtn,:root[data-theme="dark"] #app>p:first-child>.link,:root[data-theme="dark"] .top>.link{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.55);color:#fff}
:root[data-theme="dark"] .navbtn:hover,:root[data-theme="dark"] .pillbtn:hover{background:rgba(255,255,255,.2);border-color:var(--glow)}
:root[data-theme="dark"] .navbtn.main{background:#fff;color:#12152e;border-color:#fff}
:root[data-theme="dark"] .pillbtn.on{background:var(--track);color:#12152e;border-color:var(--track);box-shadow:0 0 10px rgba(255,209,102,.5)}
:root[data-theme="dark"] .hook{background:color-mix(in srgb,var(--track) 16%,var(--s2));border-left-color:var(--track)}
:root[data-theme="dark"] .step span,:root[data-theme="dark"] .num{background:var(--track);color:#12152e;box-shadow:0 0 12px rgba(255,209,102,.5)}
:root[data-theme="dark"] .label{color:#c9cff5}
:root[data-theme="dark"] .gtab>b{background:var(--bg)}
:root[data-theme="dark"] .pairs>*{background:var(--s2)}
:root[data-theme="dark"] .tl{background:color-mix(in srgb,var(--track) 10%,var(--s2))}
:root[data-theme="dark"] .gtop,:root[data-theme="dark"] .arcadebox{box-shadow:inset 0 0 0 2px #4b50a8,0 0 24px rgba(76,201,240,.18)}
:root[data-theme="dark"] .avatar{box-shadow:0 0 12px rgba(255,209,102,.45)}
:root[data-theme="dark"] .labsay,:root[data-theme="dark"] .optpan,:root[data-theme="dark"] .ideas{background:var(--bg)}
:root[data-theme="dark"] .labrow,:root[data-theme="dark"] .ownbox{background:var(--s2)}
:root[data-theme="dark"] .msg{background:var(--s1);color:var(--ink)}
:root[data-theme="dark"] .msg.me{background:var(--brand);color:#0b0d1f}
:root[data-theme="dark"] .notch{clip-path:none}
/* write the story */
.storytask{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.storytask p{margin:0;font-weight:600}
.tense{font-family:var(--label);font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;background:#ffd166;color:#12152e;box-shadow:0 0 14px rgba(255,209,102,.45)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.panel{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:16px;border:3px solid #17213b;box-shadow:4px 4px 0 #17213b}
.panel.p0{background:#ffe6a7}.panel.p1{background:#bfe8ff}.panel.p2{background:#ffd0dc}.panel.p3{background:#cdf5dd}
.panel .scene{font-size:clamp(30px,6vw,54px);line-height:1.1;text-align:center;letter-spacing:2px}
.panel .pn{position:absolute;top:6px;left:8px;width:28px;height:28px;border-radius:50%;background:#17213b;color:#fff;display:grid;place-items:center;font-size:14px}
.strip.mini{display:flex;gap:4px;margin:4px 0;font-size:22px}
.strip.mini span{background:var(--bg);border-radius:8px;padding:2px 6px}
.vchips{display:grid;gap:6px;margin-bottom:6px}
.storyin{font-size:18px;line-height:1.6}
.ownbox .inp{width:100%;max-width:none}
:root[data-theme="dark"] .act.cp{background:linear-gradient(160deg,color-mix(in srgb,var(--track) 22%,var(--s2)),var(--s2));border-color:var(--track);--glow:#ffd166}
:root[data-theme="dark"] .act.cp p,:root[data-theme="dark"] .act.cp .label,:root[data-theme="dark"] .act.cp .foot{color:var(--ink);opacity:1}
:root[data-theme="dark"] .act.cp h3{color:var(--track)}
.vchips .link{justify-self:start}
:root[data-theme="dark"] .prog i{background:linear-gradient(90deg,var(--glow),var(--track));box-shadow:0 0 10px var(--glow)}
:root[data-theme="dark"] .opt{background:linear-gradient(160deg,var(--s1),var(--s2));border:2px solid var(--line);transition:transform .12s,border-color .12s}
:root[data-theme="dark"] .opt:hover:not(:disabled){border-color:var(--glow);transform:translateX(4px)}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,1fr)}}

/* ===== option A: one navy for every page, with the thick bottom line from option D ===== */
:root[data-theme="dark"] body,:root[data-theme="dark"] body[data-tone]:not([data-tone=""]){--bg:#12152e;--s1:#262b63;--s2:#1f2456;--surface:#1f2456;--line:#3a3f8c;
  background:radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.45),transparent),radial-gradient(1.5px 1.5px at 70% 18%,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 45% 75%,rgba(255,255,255,.3),transparent),radial-gradient(1.5px 1.5px at 88% 62%,rgba(255,255,255,.35),transparent),#12152e;
  background-size:320px 320px,320px 320px,320px 320px,320px 320px,auto;background-attachment:fixed}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .stop{background:#1f2456;border:2px solid var(--glow);border-bottom-width:6px;box-shadow:none}
:root[data-theme="dark"] .act:hover,:root[data-theme="dark"] .stop:hover,:root[data-theme="dark"] .mitem:hover,:root[data-theme="dark"] .guide:hover{transform:translateY(-2px);box-shadow:none;border-color:var(--glow)}
:root[data-theme="dark"] .btn{box-shadow:none;border:2px solid #b8860b;border-bottom-width:5px}

:root[data-theme="dark"] .btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
:root[data-theme="dark"] .btn.ghost{border:2px solid #fff;border-bottom-width:5px;color:#fff}
:root[data-theme="dark"] .navbtn{background:transparent;border:2px solid #fff;border-bottom-width:4px;color:#fff}
:root[data-theme="dark"] .navbtn.main{background:#fff;color:#12152e;border-color:#c9cff5}
:root[data-theme="dark"] .pillbtn,:root[data-theme="dark"] .chip{background:transparent;border:1.5px solid #fff;color:#fff}

:root[data-theme="dark"] .opt{background:#1f2456;border:2px solid #3a3f8c;border-bottom-width:5px}
:root[data-theme="dark"] .opt:hover:not(:disabled){border-color:var(--glow)}
.shop .face{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center}
.pimg{border-radius:50%;background:#fff}
:root[data-theme="dark"] .pcard,:root[data-theme="dark"] .pcard.own{background:#1f2456}
:root[data-theme="dark"] .shop .card{border-color:#ff6b9a}
:root[data-theme="dark"] .pshop .card.own,:root[data-theme="dark"] .shop .card:has(.badge){border-color:#5be3a8}
:root[data-theme="dark"] #app>p:first-child>.link,:root[data-theme="dark"] .top>.link{background:transparent;border:2px solid #fff;border-bottom-width:4px;color:#fff}
.themebtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center;padding:0}
.bar{gap:12px 12px}
.bar .stat{white-space:nowrap}
:root[data-theme="dark"] .themebtn{border-color:#fff;background:transparent}
.locked{font-family:var(--label);font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;border:1.5px solid #8a90c0;color:#c9cff5;cursor:not-allowed}
:root[data-theme="light"] .locked{border-color:var(--line);color:var(--muted)}

:root[data-theme="light"]{--bg:#f4f1ff;--surface:#ffffff;--ink:#1d1a4a;--muted:#55527a;--line:#c9c4ef;--brand:#534AB7;--on-brand:#ffffff}

"a1-2":{pts:[{t:"Present simple",use:"Use the present simple for routines, habits and facts.",pt:"Use o present simple para rotinas, hábitos e fatos. Com he / she / it o verbo ganha -s, e a pergunta e a negativa usam does.",

  ex:["I get up at seven.","What does she cook?"],bad:["She don't works on Sundays.","She doesn't work on Sundays."]},{t:"Adverbs of frequency and word order",use:"Adverbs of frequency (always, usually, often, sometimes, never) go before the main verb but after be. Expressions like every day or once a week go at the end of the sentence.",pt:"Always, usually, often, sometimes e never vêm antes do verbo principal, mas depois do verbo be. Expressões como every day, once a week e every summer ficam no fim da frase. Dá para usar os dois quando um completa o outro (I usually go twice a week). Não junte quando repetem a ideia (always + every day) ou se contradizem (never + once a week, sometimes + every day).",

/* tips to avoid mistakes + Translanguaging (Portuguese ↔ English), one entry per grammar point */
var GX={
"a1-1":[{tips:["Age, hunger, cold and fear use be: I'm 25, I'm hungry, I'm cold, I'm afraid.","Never drop the subject: say It is late, not Is late.","In short positive answers, do not contract: Yes, I am."],
 tl:[["Eu tenho 25 anos.","I am 25 (years old)."],["Estou com fome.","I am hungry."],["Eu sou professora. / Eu estou em casa.","I am a teacher. / I am at home."],["É tarde.","It is late."]],
 note:"Portuguese has two verbs, ser and estar. English has only one: be. Portuguese uses ter for age and estar com for many feelings; English uses be. English also needs a / an before a job, and a sentence always needs a subject."},
 {tips:["Ask: who is the owner? A man → his. A woman → her.","Possessive adjectives never take -s: my friends, not mys friends.","Use your for one person and for many people: your name, your names."],
 tl:[["O irmão dela é médico.","Her brother is a doctor."],["A irmã dele é enfermeira.","His sister is a nurse."],["Qual é o seu nome?","What is your name?"],["Nossa escola é nova.","Our school is new."]],
 note:"In Portuguese, seu / sua changes with the thing: seu irmão, sua irmã. In English, his / her changes with the owner. Dele / dela comes after the noun; his / her comes before the noun."}],
"a1-2":[{tips:["Check the subject first. If it is he, she or it, add -s to the verb.","With does or doesn't, the main verb loses the -s: Does she work? She doesn't work.","Put always, usually, often and never before the main verb: I usually relax."],
 tl:[["Você trabalha aqui?","Do you work here?"],["Ela não trabalha aos domingos.","She doesn't work on Sundays."],["Eu trabalho. / Ela trabalha.","I work. / She works."]],
 note:"Portuguese makes questions with intonation only, and negatives with não. English needs the helper do / does. The good news: Portuguese changes the verb for every person, and English changes it only for he, she and it."}],
"a1-3":[{tips:["Look at the noun that follows: one thing → there is; more than one → there are.","Use any in negatives and questions with plural nouns: There aren't any shops.","Do not start with Have or It has to say that something exists."],
 tl:[["Tem uma farmácia aqui perto.","There is a pharmacy near here."],["Tem dois cafés nesta rua.","There are two cafés on this street."],["Tem um banco aqui?","Is there a bank here?"]],
 note:"In Brazilian Portuguese, tem (or há) is the same for singular and plural. English uses there + be, and be changes: is for one, are for more than one."},
 {tips:["After can, use the verb with no to and no -s: She can swim.","For questions, change the order: Can you…? Do not use do.","Can't is the usual negative in speech."],
 tl:[["Eu sei nadar.","I can swim."],["Posso entrar?","Can I come in?"],["Você consegue me ouvir?","Can you hear me?"]],
 note:"Portuguese uses three verbs here: saber, poder and conseguir. English often uses can for all three. Like poder + infinitivo, can is followed by the base verb."}],
"a1-4":[{tips:["Learn the common uncountable nouns: bread, rice, money, information, advice, news, furniture, homework.","To count them, use a unit: a piece of advice, a slice of bread, a bottle of water.","Use How much is it? for prices, even with countable things."],
 tl:[["Quanto açúcar? / Quantos ovos?","How much sugar? / How many eggs?"],["Tenho duas informações.","I have two pieces of information."],["Quero um pão.","I'd like some bread. / I'd like a bread roll."]],
 note:"Quanto / quantos works like much / many, so the idea is similar. The difference is the list: informação, conselho, pão and notícia are countable in Portuguese, but information, advice, bread and news are uncountable in English."}],
"a2-1":[{tips:["After did or didn't, always use the base verb: Did you go? I didn't go.","Learn irregular verbs in small groups, a few each week.","Regular verbs take -ed for every person: I stayed, she stayed, they stayed.","Há dois anos = two years ago. Ago basically means behind, like atrás in Portuguese: two years ago = dois anos atrás (two years behind us). Like atrás, ago comes after the time, never before it."],
 tl:[["eu fui / você foi / nós fomos","I went / you went / we went"],["Você foi?","Did you go?"],["Eu não fui.","I didn't go."],["Eu fui lá há dois anos.","I went there two years ago."]],
 note:"Good news: Portuguese changes the past for every person, and English uses one form for all. The difference is in questions and negatives: English needs did, and the main verb returns to the base form. Portuguese puts há before the time; English puts ago after it. Think of atrás: dois anos atrás and two years ago have the same order, because ago means behind."},
 {tips:["Use was with I, he, she, it and were with you, we, they.","Use when before the short action: …when the phone rang.","Verbs like know, like and want are not normally used in the continuous."],
 tl:[["Eu estava nadando quando um cachorro pegou meu sanduíche.","I was swimming when a dog took my sandwich."],["Quando eu era criança, eu nadava todo dia.","When I was a child, I swam every day. / I used to swim every day."]],
 note:"Estava + -ndo and was / were + -ing work in the same way. Be careful with the Portuguese imperfeito for habits (nadava): in English this is the past simple or used to, not the past continuous."}],
"a2-2":[{tips:["After will, use the base verb with no to: I will call.","For plans you have already made, use going to, not will.","Add a time to the present continuous so the future meaning is clear: I'm working tomorrow."],
 tl:[["Vou reservar um hotel.","I'm going to book a hotel."],["Eu te ligo amanhã.","I'll call you tomorrow."],["A gente viaja no sábado.","We're leaving on Saturday."]],
 note:"Ir + infinitivo and be going to are very similar. The difference: Portuguese often uses the present for the future (Eu te ligo amanhã). In English the present simple sounds wrong here; use will for a promise or the present continuous for an arrangement."}],
"a2-3":[{tips:["One syllable, or two syllables ending in -y: add -er / -est. Longer adjectives: more / the most.","Never use more and -er together: say better, not more better.","Compare with than, not that or of."],
 tl:[["mais caro (do) que","more expensive than"],["mais barato (do) que","cheaper than"],["melhor / pior","better / worse"],["tão bom quanto","as good as"]],
 note:"Portuguese uses mais for every adjective. English uses more only for long adjectives; short ones take -er. Melhor and pior are irregular in both languages, and tão… quanto works like as… as."}],
"a2-4":[{tips:["If you say when (yesterday, in 2019, last year), use the past simple.","Learn the third column of irregular verbs: go – went – gone, see – saw – seen.","Put just, already and never between have and the participle; put yet at the end."],
 tl:[["Você já foi a Londres?","Have you ever been to London?"],["Eu nunca comi sushi.","I have never eaten sushi."],["Tenho estudado muito.","I have been studying a lot."]],
 note:"This is a real difference. Portuguese uses the pretérito perfeito with já and nunca; English uses the present perfect. The form looks like tenho feito, but the meaning is different: tenho estudado describes a repeated recent activity."},
 {tips:["Add please, and use could for extra politeness.","After Could you tell me…, use statement order: where the station is.","Do not use do / does / did in the indirect part."],
 tl:[["Você poderia me ajudar?","Could you help me?"],["Você pode me dizer onde fica a estação?","Could you tell me where the station is?"]],
 note:"Poderia and could are similar. Be careful with word order: Portuguese says onde fica a estação (verb before subject), but English says where the station is (subject before verb)."}],
"b1-1":[{tips:["Look for the time expression. Finished time → past simple. For, since or how long (until now) → present perfect.","Do not use the present simple with for / since: say I've lived here for five years.","Since + a point in time; for + a length of time."],
 tl:[["Moro aqui há cinco anos.","I have lived here for five years."],["Trabalho aqui desde 2019.","I have worked here since 2019."],["Mudei em 2022.","I moved in 2022."]],
 note:"Portuguese uses the present with há and desde. English uses the present perfect for situations that started in the past and continue now. For finished times, both languages use the simple past."},
 {tips:["Used to exists only in the past. For present habits, say I usually…","After did / didn't, write use to with no -d.","Do not confuse it with be used to + -ing (estar acostumado a)."],
 tl:[["Eu costumava faltar às aulas. / Eu faltava às aulas.","I used to skip classes."],["Eu costumo acordar cedo.","I usually get up early."]],
 note:"Used to is like costumava or the imperfeito (faltava). The difference: Portuguese also has costumo for the present, but English has no present form of used to. Say usually."}],
"b1-2":[{tips:["After should, must and can, use the base verb with no to.","Have to changes with the person and the time: she has to, we had to. Must does not change.","Stop and check the negative: mustn't = it is prohibited; don't have to = it is your choice."],
 tl:[["Você deveria descansar.","You should rest."],["Tenho que trabalhar amanhã.","I have to work tomorrow."],["Você não pode dirigir.","You mustn't drive."],["Você não precisa pagar.","You don't have to pay."]],
 note:"Ter que and have to are almost the same. The trap is the negative: não tem que can sound like a prohibition in Portuguese, but don't have to only means it is not necessary. For a prohibition (não pode), use mustn't or can't."}],
"b1-3":[{tips:["Never put will in the if part.","When the if part comes first, add a comma.","Unless means if… not: Unless we hurry, we'll miss the bus."],
 tl:[["Se eu aceitar, vou ter que me mudar.","If I accept, I'll have to move."],["Se chover, a gente fica em casa.","If it rains, we'll stay at home."]],
 note:"The structure is similar, but Portuguese uses the futuro do subjuntivo after se (aceitar, chover). English has no such tense and uses the present simple: if I accept, if it rains."},
 {tips:["Never put would in the if part.","In advice, use were: If I were you…","The past form here does not mean past time. It shows that the situation is imaginary."],
 tl:[["Se eu tivesse mais tempo, eu ajudaria.","If I had more time, I would help."],["Se eu fosse você, eu iria.","If I were you, I'd go."]],
 note:"The two languages match well: tivesse ↔ had, ajudaria ↔ would help. Remember that English uses the ordinary past simple where Portuguese uses the imperfeito do subjuntivo."}],
"b1-4":[{tips:["Always include a form of be; it shows the tense: is used, was stolen, has been shared.","Use the past participle (third column), not the past simple: was taken, not was took.","Add by + person only when it is important."],
 tl:[["O quadro foi roubado.","The painting was stolen."],["Fala-se inglês aqui. / Falam inglês aqui.","English is spoken here."],["Roubaram meu celular.","My phone was stolen."]],
 note:"Ser + particípio and be + past participle are built in the same way. The difference is frequency: Portuguese often avoids the passive with se or with an unnamed they (roubaram), and English prefers the passive in these cases."},
 {tips:["Say takes no person: She said (that)… Tell needs a person: She told me (that)…","Move the verb one step back: present → past, will → would, can → could.","Change the pronouns and time words too: I → she, tomorrow → the next day."],
 tl:[["Ela disse que estava ocupada.","She said (that) she was busy."],["Ele me disse que ia se atrasar.","He told me he would be late."]],
 note:"The tense change is similar in both languages (está → estava, is → was). Two differences: that is optional in English but que is necessary in Portuguese, and dizer covers both say and tell."}],
"b1-5":[{tips:["Keep two lists: verbs + -ing (enjoy, avoid, miss, finish, keep) and verbs + to (want, decide, hope, plan).","After any preposition (in, at, of, about, for), use -ing.","When an action is the subject of the sentence, use -ing: Swimming is good for you."],
 tl:[["Eu gosto de cozinhar.","I enjoy cooking."],["Nadar faz bem.","Swimming is good for you."],["Decidi mudar de emprego.","I decided to change jobs."],["Sou boa em resolver problemas.","I'm good at solving problems."]],
 note:"Portuguese uses the infinitivo in all these cases. English divides them: some verbs take -ing, others take to, and after a preposition it is always -ing. In Portuguese, -ndo is only for actions in progress."},
 {tips:["Who for people, which for things, where for places. That works for people and things.","Do not repeat the pronoun: the book that I read, not the book that I read it.","You can leave out who / that when it is the object: the book I read."],
 tl:[["a mulher que ligou","the woman who called"],["o livro que eu li","the book (that) I read"],["o lugar onde eu trabalho","the place where I work"]],
 note:"Portuguese uses que for people and things. English separates them: who for people, which or that for things. Onde and where work in the same way. English can also drop the pronoun when it is the object; Portuguese cannot."},
 {tips:["Although joins two clauses in one sentence. However starts a new sentence and takes a comma.","Do not use although and but together.","Despite and in spite of are followed by a noun or -ing, not a full clause."],
 tl:[["Embora estivesse tarde, continuamos.","Although it was late, we continued."],["Estava tarde. No entanto, continuamos.","It was late. However, we continued."],["Na minha opinião, …","In my opinion, …"]],
 note:"Embora ↔ although and no entanto ↔ however match well. The difference: embora needs the subjuntivo in Portuguese, but although is followed by a normal verb. And it is in my opinion, not for my opinion."}]
};

GR["a2-5"]={pts:[{t:"Relative pronouns: who, which, where, that",use:"Use a relative clause to say which person, thing or place you mean. Who is for people, which is for things, where is for places. That can replace who or which.",pt:"Em português usamos que para tudo. Em inglês, escolha: who para pessoas, which para coisas, where para lugares. That pode substituir who ou which.",
  form:[["who","people: the girl who sings · the man who helped me"],["which","things: the bus which goes to the beach"],["where","places: the café where we met"],["that","people or things: the film that we saw · the boy that lives here"]],
  ex:["She's the teacher who helped me.","This is the café where we met."],bad:["The man which lives here is a doctor.","The man who lives here is a doctor."]},
 {t:"Don't repeat the person or thing",use:"The relative pronoun already stands for the person or thing. Don't add he, she, it or them again.",pt:"O pronome relativo já representa a pessoa ou a coisa. Não repita he, she, it ou them depois dele.",
  form:[["✗","the boy who he lives here"],["✓","the boy who lives here"],["✗","the book that I read it"],["✓","the book that I read · the book I read"]],
  ex:["That's the phone I bought last week.","The people who live here are friendly."],bad:["This is the book that I read it.","This is the book that I read."]}],
 qc:[["She's the girl ___ won the race.",["who","which","where"]],["This is the town ___ I grew up.",["where","which","who"]],["The cake ___ you made is delicious.",["that","who","where"]],["Choose the correct sentence.",["The film that we saw was great.","The film that we saw it was great.","The film who we saw was great."]]]};

  ex:["It's cold today, isn't it?","You've been to London, haven't you?"],bad:["She likes coffee, isn't she?","She likes coffee, doesn't she?"]},

  form:[["at","at first · at last · at least · at once · at times · at the moment"],["by","by accident · by chance · by mistake · by hand"],["in","in time · in a hurry · in danger · in trouble · in the end"],["on","on time · on purpose · on foot · on sale · on average"]],

GR["b2-1"]={pts:[{t:"Non-defining relative clauses",use:"A non-defining clause adds extra information about a person, thing or place we already know. Put it between commas. Use who, which or where, never that, and never leave out the pronoun.",pt:"A oração não restritiva dá uma informação extra: se você tirar, a frase continua clara. Vai entre vírgulas, como em português. A diferença: em inglês nunca use that nela, e o pronome não pode sumir.",

  form:[["whose","the boy whose dad is a pilot · Mr Lima, whose son is in my class, …"],["who's ≠ whose","who's = who is · whose = possession"],[", which","He passed the test, which was a surprise."],["✗ what","She called me, what was nice. → , which was nice"]],
  ex:["The singer, whose songs I love, is coming to Rio.","It rained all day, which ruined our picnic."],bad:["He arrived late, what annoyed everyone.","He arrived late, which annoyed everyone."]}],

GX["a2-5"]=[{tips:["Ask: is it a person, a thing or a place? Then choose who, which or where.","That is fine for people and things, but not for places.","After the pronoun, go straight to the verb or the new subject: the man who lives…, the bag that I bought."],

  note:"Portuguese uses que for people and things. English chooses who or which. Both languages use onde / where for places."},
 {tips:["Read your sentence without the pronoun at the start: does it already have a subject? Then don't add he or she.","When the pronoun is the object, you can leave it out: the book I read.","Never write the book that I read it."],
  tl:[["O livro que eu li era ótimo.","The book that I read was great."],["As pessoas que moram aqui são simpáticas.","The people who live here are friendly."],["O celular que eu comprei quebrou.","The phone I bought broke."],["O menino que mora aqui é legal.","The boy who lives here is nice."]],

  tl:[["Fiz isso sem querer.","I did it by accident."],["Fiz isso de propósito.","I did it on purpose."],["Vou para a escola a pé.","I go to school on foot."],["No começo, não gostei.","At first, I didn't like it."]],

  tl:[["O menino cujo pai é piloto é meu amigo.","The boy whose dad is a pilot is my friend."],["A cantora, cujas músicas eu adoro, vem ao Rio.","The singer, whose songs I love, is coming to Rio."],["Choveu o dia todo, o que estragou o piquenique.","It rained all day, which ruined the picnic."],["Ele passou, o que foi uma surpresa.","He passed, which was a surprise."]],
