<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Spotlight · Talk It Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#171a3a;--ink:#fff;--mute:#b9b6d8;--yel:#f2c14e;--grn:#3ccf9f;--vio:#9d93ff;--org:#ff8a5c;--cya:#4cc9f0;
 --disp:"Bricolage Grotesque",system-ui,sans-serif;--body:"Source Sans 3",system-ui,sans-serif;--label:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:18px/1.5 var(--body);min-height:100vh;padding:0 16px 50px;
 background-image:radial-gradient(circle at 20% 0,#2a2f6b 0,transparent 55%),radial-gradient(circle at 90% 100%,#2a1f56 0,transparent 50%)}
#app{max-width:600px;margin:0 auto;padding-top:24px}
h1{font:800 clamp(30px,7.5vw,44px)/1.05 var(--disp);color:var(--yel);margin-top:8px;
 text-shadow:0 0 16px rgba(242,193,78,.35)}
h2{font:800 22px var(--disp)}
.label{font:700 13.5px/1.2 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card{background:#1d2048;border:2px solid var(--cya);border-bottom-width:6px;border-radius:20px;padding:20px}
.how{list-style:none;display:grid;gap:10px;margin:16px 0}
.how li{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;
 background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-size:19px;line-height:1.4}
.how .e{font-size:27px;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.row.spread{justify-content:space-between}
.btn{font:800 18px var(--label);cursor:pointer;border:0;border-radius:999px;padding:13px 22px;
 background:var(--yel);color:#12152e;box-shadow:0 4px 0 #b98c1f}
.btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55);box-shadow:none}
.btn.small{font-size:15px;padding:9px 15px}

.hud{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 16px}
.hud>div{background:#12152e;border:2px solid #3b3f8f;border-radius:14px;padding:9px 12px}
.hud .label{font-size:11.5px}
.hud b{display:block;font:800 23px var(--label);color:var(--yel);margin-top:2px}

.palco{background:#12152e;border:2px solid #3b3f8f;border-radius:18px;padding:24px 20px;text-align:center}
.neutra{font:600 23px/1.42 var(--body)}
.neutra .foco{background:var(--yel);color:#12152e;border-radius:8px;padding:2px 8px;font-weight:800;
 box-shadow:0 0 26px rgba(242,193,78,.55)}
.pergunta{margin-top:18px;font:700 17px var(--label);color:var(--mute)}

.ops{display:grid;gap:10px;margin-top:16px}
.op{font:800 19px var(--label);cursor:pointer;padding:17px 12px;border-radius:14px;
 background:#1d2048;color:#fff;border:2px solid #3b3f8f;transition:background .12s,border-color .12s}
.op small{display:block;font:400 14.5px var(--body);color:var(--mute);margin-top:4px}
.op.certa{background:rgba(60,207,159,.2);border-color:var(--grn)}
.op.errada{background:rgba(255,120,130,.16);border-color:#ff7882}
.op:disabled{cursor:default}

.saida{margin-top:16px;padding:18px 18px;border-radius:16px;background:rgba(255,255,255,.08);
 border:2px solid rgba(255,255,255,.2);display:none}
.saida.on{display:block}
.saida .res{font:700 23px/1.4 var(--body)}
.saida .res b{color:var(--yel)}
.saida .porq{margin-top:10px;font-size:16.5px;color:var(--mute)}
.segue{display:block;width:100%;margin-top:14px;font:800 18px var(--label);cursor:pointer;
 padding:16px;border:0;border-radius:14px;background:var(--grn);color:#12152e}

.regras{display:grid;gap:9px;margin:14px 0 2px}
.regras div{background:rgba(255,255,255,.07);border-radius:13px;padding:12px 14px;font-size:16.5px}
.regras b{display:block;font:800 16px var(--label);color:var(--yel);margin-bottom:3px}
.stars{font-size:34px;margin:8px 0}
.miss{display:grid;gap:8px;margin-top:12px;text-align:left}
.miss div{background:rgba(255,120,130,.14);border:2px solid rgba(255,120,130,.45);
 border-radius:12px;padding:11px 13px;font-size:16.5px}
.miss div b{color:var(--yel)}
footer{margin:28px auto 0;max-width:600px;text-align:center;font-size:13.5px;color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<footer>Talk It Out · by Luisa Mesel</footer>

<script>
(function(){
"use strict";

var ESTR = [
 ["it","It-cleft","It was X who / that …"],
 ["what","What-cleft","What … is / was X"],
 ["inv","Inversion","Only / Never + auxiliary + subject"]
];

/* [frase neutra, pedaco no holofote, estrutura, frase resultante, porque] */
var Q = [
["Clara finally understood the rule after the test.","Clara","it",
 "It was <b>Clara</b> who finally understood the rule.",
 "The spotlight is on a person, so the sentence splits around <b>It was … who</b>."],
["Clara finally understood the rule after the test.","after the test","inv",
 "Only <b>after the test</b> did she understand the rule.",
 "The spotlight is on a time phrase with <b>only</b>, and that forces the auxiliary in front of the subject."],
["Clara finally understood the rule after the test.","the rule","what",
 "What she finally understood was <b>the rule</b>.",
 "The spotlight is on the thing itself, so <b>What … was</b> holds it to the end of the sentence."],
["Her coach booked the court on Friday.","Her coach","it",
 "It was <b>her coach</b> who booked the court on Friday.",
 "A person in the spotlight takes <b>It was … who</b>."],
["I need a break.","a break","what",
 "What I need is <b>a break</b>.",
 "The thing you want goes to the end, after <b>What I need is</b>."],
["She only told me the truth at the end.","at the end","inv",
 "Only <b>at the end</b> did she tell me the truth.",
 "<b>Only</b> at the front pulls <b>did</b> in before the subject."],
["The weather ruined the final.","The weather","it",
 "It was <b>the weather</b> that ruined the final.",
 "For a thing rather than a person, the link word is <b>that</b>."],
["He wants everyone to listen.","everyone to listen","what",
 "What he wants is <b>for everyone to listen</b>.",
 "A whole idea in the spotlight still fits <b>What … is</b>, with <b>for</b> before it."],
["They realised the mistake only after the match.","only after the match","inv",
 "Only after the match <b>did they realise</b> the mistake.",
 "Move the <b>only</b> phrase to the front and the auxiliary has to follow it."],
["I admire her honesty.","her honesty","what",
 "What I admire is <b>her honesty</b>.",
 "The thing admired moves to the end, after <b>is</b>."],
["My sister sent the message, not me.","My sister","it",
 "It was <b>my sister</b> who sent the message, not me.",
 "Correcting who did something is exactly what the <b>It-cleft</b> is for."],
["She had never danced in public before that night.","never","inv",
 "Never before that night <b>had she danced</b> in public.",
 "<b>Never</b> at the front is negative, so <b>had</b> jumps in front of <b>she</b>."]
];

var app=document.getElementById("app");
var fila=[], i=0, ok=0, miss=[];

function h(t,at){
  var e=document.createElement(t);
  if(at)for(var k in at){
    if(k==="on")for(var ev in at.on)e.addEventListener(ev,at.on[ev]);
    else if(k==="html")e.innerHTML=at.html;
    else if(at[k]!=null)e.setAttribute(k,at[k]);
  }
  for(var n=2;n<arguments.length;n++){
    var c=arguments[n]; if(c==null)continue;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return e;
}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function nome(id){for(var k=0;k<ESTR.length;k++)if(ESTR[k][0]===id)return ESTR[k][1];return id}

function start(){
  app.innerHTML="";
  var regras=h("div",{class:"regras"});
  ESTR.forEach(function(e){
    regras.appendChild(h("div",{html:"<b>"+e[1]+"</b>"+e[2]}));
  });
  app.appendChild(h("div",{class:"card"},
    h("span",{class:"label"},"Inversion and cleft sentences"),
    h("h1",null,"🔦 Spotlight"),
    h("ol",{class:"how"},
      h("li",null,h("span",{class:"e"},"🔦"),h("span",null,"One part of the sentence is lit up.")),
      h("li",null,h("span",{class:"e"},"🎯"),h("span",{html:"Choose the structure that puts <b>that part</b> in the spotlight."})),
      h("li",null,h("span",{class:"e"},"💡"),h("span",null,"Then you see the sentence rewritten, and why."))),
    h("span",{class:"label"},"The three structures"),
    regras,
    h("div",{class:"row"},h("button",{class:"btn",on:{click:jogar}},"▶ Play"))
  ));
  window.scrollTo(0,0);
}

function jogar(){
  fila=shuffle(Q); i=0; ok=0; miss=[];
  app.innerHTML="";
  var hud=h("div",{class:"hud"}), palco=h("div",{class:"palco"}),
      ops=h("div",{class:"ops"}), saida=h("div",{class:"saida"});
  app.appendChild(h("div",{class:"row spread"},h("h2",null,"🔦 Spotlight"),
    h("button",{class:"btn ghost small",on:{click:start}},"← Quit")));
  app.appendChild(hud); app.appendChild(palco); app.appendChild(ops); app.appendChild(saida);

  function drawHud(){
    hud.innerHTML="";
    hud.appendChild(h("div",null,h("span",{class:"label"},"Right"),h("b",null,ok+" / "+fila.length)));
    hud.appendChild(h("div",null,h("span",{class:"label"},"Sentence"),h("b",null,(i+1)+" / "+fila.length)));
  }

  function pinta(){
    drawHud();
    saida.className="saida"; saida.innerHTML=""; ops.innerHTML="";
    var q=fila[i];
    var frase=q[0].replace(q[1],'<span class="foco">'+q[1]+'</span>');
    palco.innerHTML='<p class="neutra">'+frase+'</p>'+
      '<p class="pergunta">Which structure puts that in the spotlight?</p>';
    shuffle(ESTR).forEach(function(e){
      var b=h("button",{class:"op",html:e[1]+"<small>"+e[2]+"</small>"});
      b.addEventListener("click",function(){
        var todos=ops.querySelectorAll(".op");
        for(var k=0;k<todos.length;k++)todos[k].disabled=true;
        var acertou=e[0]===q[2];
        b.classList.add(acertou?"certa":"errada");
        if(acertou)ok++; else{
          miss.push(q);
          for(var j=0;j<todos.length;j++)
            if(todos[j].textContent.indexOf(nome(q[2]))===0)todos[j].classList.add("certa");
        }
        saida.innerHTML='<p class="res">'+q[3]+'</p><p class="porq">'+q[4]+'</p>';
        saida.className="saida on";
        var seg=h("button",{class:"segue"},i===fila.length-1?"See how it went":"Next sentence");
        seg.addEventListener("click",function(){
          if(i===fila.length-1){fim();return}
          i++; pinta(); window.scrollTo(0,0);
        });
        saida.appendChild(seg);
        drawHud();
      });
      ops.appendChild(b);
    });
  }

  function fim(){
    app.innerHTML="";
    var stars=ok===fila.length?3:ok>=fila.length-2?2:ok>=fila.length/2?1:0;
    var c=h("div",{class:"card"},
      h("span",{class:"label"},ok===fila.length?"Perfect":"Done"),
      h("h1",null,ok+" / "+fila.length),
      h("div",{class:"stars"},"⭐".repeat(stars)+"☆".repeat(3-stars)));
    if(miss.length){
      var mi=h("div",{class:"miss"});
      miss.forEach(function(q){
        mi.appendChild(h("div",{html:"<b>"+nome(q[2])+"</b><br>"+q[3]}));
      });
      c.appendChild(h("span",{class:"label"},"Look at these again"));
      c.appendChild(mi);
    }
    c.appendChild(h("div",{class:"row"},
      h("button",{class:"btn",on:{click:jogar}},"↻ Play again"),
      h("button",{class:"btn ghost small",on:{click:start}},"← Menu")));
    app.appendChild(c); window.scrollTo(0,0);
  }

  pinta();
}

start();
})();
</script>


<!-- tio-barra -->
<style id="tio-barra-css">
.tio-bar{position:sticky;top:0;z-index:9999;display:flex;align-items:center;gap:10px;
 flex-wrap:wrap;width:100%;max-width:100%;margin:0 0 14px;padding:10px 16px;
 box-sizing:border-box;
 background:rgba(127,127,127,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 border-bottom:1px solid rgba(127,127,127,.32);color:inherit;
 font:600 15px/1 Inter,system-ui,sans-serif}
.tio-bar .sp{flex:1}
.tio-bar button,.tio-bar a{font:inherit;cursor:pointer;color:inherit;text-decoration:none;
 background:transparent;border:1.5px solid currentColor;border-radius:999px;
 padding:9px 15px;opacity:.85;transition:opacity .12s,background .12s;white-space:nowrap}
.tio-bar button:hover,.tio-bar a:hover{opacity:1;background:rgba(127,127,127,.18)}
.tio-bar .volta{font-weight:800;opacity:1}
@media (max-width:460px){.tio-bar{font-size:13.5px}.tio-bar button,.tio-bar a{padding:8px 12px}}
</style>

<script id="tio-barra-js">
(function(){
  var LIMPAR = false;
  var ESTADO = ["certa","certo","errada","errado","errado-box","ok","no","aberto",
                "mostra","liberada","coberta","on","hit","bad","lit","selo","rever"];

  function voltar(e){
    var mesmo = document.referrer && document.referrer.indexOf(location.origin)===0
                && document.referrer.indexOf(location.href.split("#")[0])!==0;
    if(mesmo && history.length>1){ e.preventDefault(); history.back(); }
  }

  function limpar(){
    var d=document;
    d.querySelectorAll("input").forEach(function(i){
      if(i.type==="checkbox"||i.type==="radio") i.checked=false;
      else i.value="";
      i.disabled=false; i.removeAttribute("readonly");
    });
    d.querySelectorAll("textarea").forEach(function(t){t.value="";t.disabled=false});
    d.querySelectorAll("button").forEach(function(b){
      if(!b.closest(".tio-bar")) b.disabled=false;
    });
    d.querySelectorAll("details[open]").forEach(function(x){x.open=false});
    d.querySelectorAll("*").forEach(function(el){
      if(el.closest(".tio-bar")) return;
      ESTADO.forEach(function(c){ if(el.classList.contains(c)) el.classList.remove(c); });
    });
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function barra(){
    if(document.querySelector(".tio-bar")) return;
    var bar=document.createElement("div");
    bar.className="tio-bar";
    var a=document.createElement("a");
    a.className="volta"; a.href="../../"; a.textContent="\u2190 Back";
    a.setAttribute("aria-label","Back to Talk It Out");
    a.addEventListener("click",voltar);
    bar.appendChild(a);
    bar.appendChild(Object.assign(document.createElement("span"),{className:"sp"}));
    if(LIMPAR){
      var c=document.createElement("button");
      c.type="button"; c.textContent="Clear answers";
      c.addEventListener("click",limpar);
      bar.appendChild(c);
    }
    var r=document.createElement("button");
    r.type="button"; r.textContent="Try again";
    r.addEventListener("click",function(){location.reload()});
    bar.appendChild(r);
    document.body.insertBefore(bar, document.body.firstChild);
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",barra);
  else barra();
})();
</script>
<!-- /tio-barra -->
</body>
</html>
