  function centerSet(w,s,show){center.innerHTML="";center.className="center"+(show?" show":"");center.appendChild(h("div",null,h("div",{class:"w"},w),s?h("div",{class:"s"},s):null,dots()))}
  function dots(){var d=h("div",{class:"dots"});G.seq.forEach(function(_,k){d.appendChild(h("i",{class:G.state==="input"?(k<G.i?"ok":k===G.i?"now":""):""}))});return d}
  function drawStrip(upto){if(!SPEEDS[speed][2])return;strip.innerHTML="";G.seq.slice(0,upto).forEach(function(w,k){var done=G.state==="input"&&k<G.i,now=G.state==="input"&&k===G.i;strip.appendChild(h("span",{class:"chip"+(done?" ok":"")+(now?" now":"")},(k+1)+". "+(done?G.done[k]+" ":"")+w))})}
  function lock(on){pads.forEach(function(b){b.disabled=on})}
  function show(){
    G.state="show";G.i=0;lock(true);drawHud();drawStrip(0);say.className="say";say.textContent="👀 Watch and remember…";
    var k=0,ms=SPEEDS[speed][1];
    centerSet("Ready…","",false);
    (function next(){
      wait(k===0?700:ms*.25,function(){
        if(k<G.seq.length){centerSet(G.seq[k],"word "+(k+1)+" of "+G.seq.length,true);k++;drawStrip(k);wait(ms,function(){centerSet("","",false);next()},tok)}
        else{G.state="input";G.done=[];drawStrip(G.seq.length);lock(false);centerSet("Your turn!","tap the suffixes",false);say.textContent="🧠 Tap the suffix for each root, in order."}
      },tok);
    })();
  }
  function tap(p,b){
    if(!G||G.state!=="input"||paused)return;
    var w=G.seq[G.i],ok=preps(w).indexOf(p)>=0;
    b.classList.remove("lit","no");void b.offsetWidth;
    if(ok){
      b.classList.add("lit");setTimeout(function(){b.classList.remove("lit")},260);
      G.done[G.i]=p;G.i++;drawStrip(G.seq.length);centerSet(p+" "+w,"✓",true);say.className="say good";say.textContent="✓ "+p+" "+w+(w==="time"?" (in time = early enough · on time = not late)":"");
      if(G.i>=G.seq.length){
        G.best=Math.max(G.best,G.seq.length);G.state="wait";lock(true);drawHud();
        if(G.best>=goal){G.won=true;say.textContent="🏆 "+G.best+" in a row! Level complete!";wait(1200,end,tok);return}
        if(!G.pool.length)G.pool=shuffle(comps());
        G.seq.push(G.pool.pop());
        wait(500,function(){say.textContent="⭐ Perfect! One more word…";wait(800,show,tok)},tok);
      }else wait(500,function(){if(G.state==="input")centerSet("?","word "+(G.i+1)+" of "+G.seq.length,false)},tok);
    }else{
      b.classList.add("no");G.lives--;G.state="wait";lock(true);
      var right=preps(w);G.miss.push({bad:p+" "+w,right:right.map(function(r){return r+" "+w}).join(" / "),m:meaning(right[0],w)});
      centerSet(right.join("/")+" "+w,"not “"+p+"”",true);say.className="say bad";say.textContent="✗ We say “"+right.map(function(r){return r+" "+w}).join("” or “")+"”.";drawHud();
      wait(2200,function(){if(G.lives<=0)end();else show()},tok);
    }
  }
  drawHud();show();
}
function end(){
  var g=G;G=null;paused=false;window.onkeydown=null;
  var b=bestOf(speed),rec=g.best>b;if(rec)setBest(speed,g.best);
  app.innerHTML="";
  var c=h("div",{class:"card"},h("span",{class:"label"},"Level "+SPEEDS[speed][0]),h("h1",null,g.won?"🏆 Level complete!":"🧠 Game over"),
    h("p",null,"Longest sequence:"),h("div",{class:"big"},g.best+" words"),
    h("p",{class:"mean"},(rec?"🏆 New record!":"🏆 Your best on this level: "+Math.max(b,g.best)+" words")+" · Goal: "+SPEEDS[speed][4]));
  var row=h("div",{class:"row",style:"margin-top:16px"},h("button",{class:"btn"+(g.won&&speed<SPEEDS.length-1?" ghost":""),on:{click:play}},"↻ Try again"));
  if(g.won&&speed<SPEEDS.length-1)row.appendChild(h("button",{class:"btn",on:{click:function(){speed++;play()}}},"⏭ Next level"));
  row.appendChild(h("button",{class:"btn ghost",on:{click:start}},"⚙️ Change level"));
  c.appendChild(row);
  if(g.miss.length){c.appendChild(h("h3",{class:"redh",style:"margin-top:14px"},"✗ Your mistakes"));
    c.appendChild(h("div",{class:"list"},g.miss.map(function(m){return h("div",{class:"wrongrow"},h("b",null,"✗ "+m.bad),h("span",null,"→ "+m.right+(m.m?" · "+m.m:"")))})))}
  c.appendChild(h("h3",{style:"margin-top:14px"},"The words in your last sequence"));
  c.appendChild(h("div",{class:"list"},g.seq.map(function(w){var r=preps(w);return h("div",null,h("b",null,r.join(" / ")+" "+w),h("span",null,meaning(r[0],w)))})));
  app.appendChild(c);window.scrollTo(0,0);
}
start();
</script>

<style id="tio-barra-css">
.tio-bar{position:sticky;top:0;z-index:9999;display:flex;align-items:center;gap:10px;
 flex-wrap:wrap;width:100%;max-width:100%;margin:0 0 14px;padding:10px 16px;
 box-sizing:border-box;
 background:rgba(127,127,127,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 border-bottom:1px solid rgba(127,127,127,.32);color:inherit;
 font:600 15px/1 Inter,system-ui,sans-serif}
.tio-bar .sp{flex:1}
.tio-bar button,.tio-bar a{font:inherit;cursor:pointer;color:inherit;text-decoration:none;
 background:transparent;border:1.5px solid currentColor;border-radius:999px;
 padding:9px 15px;opacity:.85;transition:opacity .12s,background .12s;white-space:nowrap}
.tio-bar button:hover,.tio-bar a:hover{opacity:1;background:rgba(127,127,127,.18)}
.tio-bar .volta{font-weight:800;opacity:1}
@media (max-width:460px){.tio-bar{font-size:13.5px}.tio-bar button,.tio-bar a{padding:8px 12px}}
</style>

<script id="tio-barra-js">
(function(){
  var LIMPAR = false, BASE = "../../";
  var ESTADO = ["certa","certo","errada","errado","errado-box","ok","no","aberto",
                "mostra","liberada","coberta","on","hit","bad","lit","selo","rever"];

  function voltar(e){
    var mesmo = document.referrer && document.referrer.indexOf(location.origin)===0
                && document.referrer.indexOf(location.href.split("#")[0])!==0;
    if(mesmo && history.length>1){ e.preventDefault(); history.back(); }
  }

  function limpar(){
    var d=document;
    d.querySelectorAll("input").forEach(function(i){
      if(i.type==="checkbox"||i.type==="radio") i.checked=false;
      else i.value="";
      i.disabled=false; i.removeAttribute("readonly");
    });
    d.querySelectorAll("textarea").forEach(function(t){t.value="";t.disabled=false});
    d.querySelectorAll("button").forEach(function(b){
      if(!b.closest(".tio-bar")) b.disabled=false;
    });
    d.querySelectorAll("details[open]").forEach(function(x){x.open=false});
    d.querySelectorAll("*").forEach(function(el){
      if(el.closest(".tio-bar")) return;
      ESTADO.forEach(function(c){ if(el.classList.contains(c)) el.classList.remove(c); });
    });
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function barra(){
    if(document.querySelector(".tio-bar")) return;
    var bar=document.createElement("div");
    bar.className="tio-bar";
    var a=document.createElement("a");
    a.className="volta"; a.href=BASE; a.textContent="\u2190 Back";
    a.setAttribute("aria-label","Back to Talk It Out");
    a.addEventListener("click",voltar);
    bar.appendChild(a);
    bar.appendChild(Object.assign(document.createElement("span"),{className:"sp"}));
    if(LIMPAR){
      var c=document.createElement("button");
      c.type="button"; c.textContent="Clear answers";
      c.addEventListener("click",limpar);
      bar.appendChild(c);
    }
    var r=document.createElement("button");
    r.type="button"; r.textContent="Try again";
    r.addEventListener("click",function(){location.reload()});
    bar.appendChild(r);
    document.body.insertBefore(bar, document.body.firstChild);
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",barra);
  else barra();
})();
</script>
<!-- /tio-barra -->
